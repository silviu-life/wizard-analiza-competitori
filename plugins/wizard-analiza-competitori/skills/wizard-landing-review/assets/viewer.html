<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagini de landing</title>
<style>
:root {
  --ink: #000; --paper: #fff; --desk: #dde7f0;
  --winner: #22e06b; --promising: #ffd23f; --too_new: #7cc6ff; --alert: #ff6b6b;
  --pick: #b28dff;
  --edge: 3px solid var(--ink); --drop: 5px 5px 0 var(--ink);
  --display: "Arial Black", "Arial Bold", Impact, "Helvetica Neue", sans-serif;
  --text: Verdana, Tahoma, "DejaVu Sans", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--desk); color: var(--ink); font: 14px/1.5 var(--text); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

.masthead { background: var(--ink); color: var(--paper); padding: 22px 24px 20px; }
.masthead h1 { font: 900 clamp(26px, 4.4vw, 52px)/1 var(--display); margin: 0 0 8px; letter-spacing: -0.02em; }
.masthead p { margin: 0; max-width: 78ch; color: #cfd8e0; }

.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px; padding: 24px; align-items: start; }
.rail { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; background: var(--paper);
  border: var(--edge); box-shadow: var(--drop); padding: 16px; }
.rail summary { font: 900 18px/1.2 var(--display); cursor: pointer; list-style: none; }
.rail summary::-webkit-details-marker { display: none; }
.rail summary::after { content: "+"; float: right; }
.rail[open] summary::after { content: "\2212"; }
.group { margin-top: 16px; }
.group h3 { font: 900 13px/1.2 var(--display); margin: 0 0 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 2px solid var(--ink); background: var(--paper); padding: 2px 8px; cursor: pointer; font-size: 12px; }
.chip[aria-pressed="true"] { background: var(--pick); box-shadow: 2px 2px 0 var(--ink); }
.chip[data-bucket][aria-pressed="true"] { background: var(--c); }
.chip small { opacity: .65; }
.field { display: block; margin-top: 8px; font-size: 12px; }
.field input[type=search], .field select { width: 100%; border: 2px solid var(--ink); padding: 6px 8px; background: var(--paper); }
.field input[type=range] { width: 100%; accent-color: var(--ink); }
.check { display: flex; gap: 8px; align-items: center; font-size: 12px; margin-top: 4px; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--ink); }
.reset { margin-top: 16px; width: 100%; border: var(--edge); background: var(--alert); padding: 8px; cursor: pointer;
  font: 900 13px var(--display); box-shadow: 3px 3px 0 var(--ink); }
.reset:active { transform: translate(3px, 3px); box-shadow: none; }

.findings { background: var(--promising); border: var(--edge); box-shadow: var(--drop); padding: 16px 18px; margin-bottom: 20px; }
.findings h2 { font: 900 20px/1.15 var(--display); margin: 0 0 8px; }
.findings ul { margin: 0; padding-left: 18px; }
.findings li { margin: 2px 0; }
.findings .note { margin: 8px 0 0; font-size: 12px; }
.bar { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.count { font: 900 22px/1 var(--display); }
.bar .field { margin: 0; min-width: 220px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 22px; align-items: start; }
.card { background: var(--paper); border: var(--edge); box-shadow: var(--drop); display: flex; flex-direction: column; }
.card.off { opacity: .6; }
.stamp { display: flex; align-items: stretch; border-bottom: var(--edge); }
.stamp .days { background: var(--c); border-right: var(--edge); padding: 8px 12px; min-width: 96px; text-align: center; }
.stamp .days b { display: block; font: 900 34px/1 var(--display); }
.stamp .days span { font-size: 11px; }
.stamp .meta { padding: 8px 10px; font-size: 12px; min-width: 0; }
.stamp .meta strong { display: block; font: 900 14px/1.2 var(--display); overflow-wrap: anywhere; }
.reach { border-bottom: var(--edge); padding: 8px 12px; background: var(--paper); }
.reach .big { font: 900 20px/1.1 var(--display); }
.reach .pace { font-size: 12px; }
.reach details { margin-top: 6px; font-size: 12px; }
.reach summary { cursor: pointer; text-decoration: underline; }
.reach h4 { font: 900 12px/1.2 var(--display); margin: 10px 0 4px; }
.row { display: grid; grid-template-columns: 74px 1fr 92px; gap: 6px; align-items: center; margin: 2px 0; }
.track { display: flex; height: 12px; border: 2px solid var(--ink); background: var(--desk); }
.track i { display: block; height: 100%; }
.track .f { background: var(--pick); } .track .m { background: var(--too_new); } .track .c { background: var(--winner); }
.key { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--ink); vertical-align: -1px; margin: 0 3px 0 8px; }
.shot { width: 100%; max-height: 340px; object-fit: contain; background: #eef2f6; border-bottom: var(--edge); display: block; }
.copy { padding: 12px; }
.copy .hook { font-weight: 700; }
.copy .body { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.copy .body.clamp { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.more { border: 0; background: none; padding: 0; margin-top: 4px; text-decoration: underline; cursor: pointer; font-size: 12px; }
.headline { border-top: 2px dashed var(--ink); margin-top: 10px; padding-top: 8px; font-size: 13px; }
.headline b { display: block; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 12px 12px; }
.tag { border: 2px solid var(--ink); padding: 1px 6px; font-size: 11px; background: var(--desk); }
.tag.yes { background: var(--ink); color: var(--paper); }
.tag.unsure { border-style: dashed; background: var(--paper); }
.card a.open { margin-top: auto; border-top: var(--edge); padding: 8px 12px; color: var(--ink); font-weight: 700; font-size: 12px; background: var(--paper); }
.card a.open:hover { background: var(--pick); }
.empty { border: var(--edge); background: var(--paper); padding: 28px; box-shadow: var(--drop); max-width: 60ch; }
.empty h2 { font: 900 22px/1.1 var(--display); margin: 0 0 8px; }

@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; padding: 16px; }
  .rail { position: static; max-height: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.dest { background: var(--too_new); border-right: var(--edge); padding: 8px 12px; min-width: 96px; text-align: center; }
.dest b { display: block; font: 900 30px/1 var(--display); }
.dest span { font-size: 11px; }
.price { font: 900 18px/1.2 var(--display); margin-top: 8px; }
.sections { padding: 0 12px 12px; font-size: 12px; }
.sections summary { cursor: pointer; text-decoration: underline; }
.sections h4 { font: 900 12px/1.2 var(--display); margin: 10px 0 2px; }
.sections p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.adlinks { padding: 0 12px 12px; font-size: 12px; }
.adlinks a { color: var(--ink); display: block; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header class="masthead">
  <h1 id="title">Pagini de landing</h1>
  <p id="lede"></p>
</header>
<div class="layout">
  <details class="rail" id="rail" open><summary>Filtre</summary><div id="filters"></div></details>
  <main>
    <section class="findings" id="findings"></section>
    <div class="bar">
      <div class="count" id="count" aria-live="polite"></div>
      <label class="field">Ordonează după
        <select id="sort">
          <option value="ads">Câte reclame duc aici</option>
          <option value="days">Cea mai longevivă reclamă</option>
          <option value="ad_match">Potrivirea cu reclama</option>
          <option value="trust">Încredere</option>
          <option value="cta_clarity">Claritatea îndemnului</option>
          <option value="promise_specificity">Specificitatea promisiunii</option>
          <option value="chars">Lungimea paginii</option>
        </select>
      </label>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>
<script src="landings-data.js"></script>
<script>
"use strict";
const PAGES = window.LANDINGS || [], META = window.META || {}, SUMMARY = window.SUMMARY || {dims: {}};

const DIM = {type: "Destinație", page_type: "Tip de pagină", main_action: "Ce i se cere vizitatorului", price_shown: "Cum arată prețul",
  offer_in_hero: "Ofertă în primul ecran", has_guarantee: "Garanție sau retur", has_rating: "Rating sau număr de recenzii",
  has_testimonials: "Testimoniale", has_urgency: "Termen sau stoc concret", has_company_id: "Date de firmă (CUI, adresă)",
  has_anpc: "ANPC / SAL / SOL", cash_on_delivery: "Plata la livrare", has_delivery_time: "Termen de livrare sau execuție",
  has_installments: "Rate", handles_objections: "FAQ sau răspuns la obiecții",
  promise_specificity: "Specificitatea promisiunii", cta_clarity: "Claritatea îndemnului", trust: "Încredere", ad_match: "Potrivirea cu reclama",
  has_form: "Are formular", has_phone: "Are telefon", has_whatsapp: "Are WhatsApp", has_email: "Are email"};
const VAL = {web: "Pagină web", whatsapp: "WhatsApp", messenger: "Messenger", phone: "Apel", maps: "Hartă", facebook: "Facebook",
  instagram: "Instagram", app_store: "Magazin de aplicații", no_link: "Fără link", none: "Deloc",
  sales_page: "Pagină de vânzare", product_page: "Pagină de produs", shop_home: "Magazin: acasă sau categorie", offer_page: "Pagină de ofertă",
  lead_funnel: "Quiz sau funnel de lead-uri", booking: "Rezervare", webinar: "Webinar sau VSL", service_home: "Pagina unui serviciu local",
  generic_home: "Homepage generic", content: "Articol sau blog", other: "Altceva",
  buy: "Cumpără", form: "Completează formular", call: "Sună", chat: "Scrie pe chat", book: "Rezervă", register: "Se înscrie",
  quiz: "Face quiz-ul", visit: "Vine la sediu",
  exact: "Preț exact", from: "Preț de pornire", on_request: "Preț la cerere"};
const label = v => VAL[v] || v;
const dims = META.dims || {};
const CHOICES = dims.choices || [], NOULS = dims.nouls || [], SCORES = dims.scores || [], FACTS = dims.facts || [];
const CHIP_DIMS = ["type", ...CHOICES];
const valueOf = (p, dim) => dim === "type" ? p.type : p.j && p.j[dim];
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return u; } };

function el(tag, props = {}, ...kids) {  // textContent only: page text is untrusted
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else if (v !== null && v !== false) n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid) n.append(kid);
  return n;
}
const safeHref = u => /^https?:/i.test(u || "") ? u : null;

const fresh = () => ({sets: {type: ["web"]}, checks: [], scores: {}, q: "", sort: "ads"});
let state = fresh();
try { if (location.hash.length > 1) state = {...fresh(), ...JSON.parse(decodeURIComponent(location.hash.slice(1)))}; } catch (e) {}
if (!PAGES.some(p => p.type === "web")) state.sets.type = [];

function passes(p) {
  for (const [dim, picked] of Object.entries(state.sets)) if (picked.length && !picked.includes(valueOf(p, dim))) return false;
  for (const c of state.checks) {
    if (FACTS.includes(c) ? !(p.facts && p.facts[c]) : !(p.j && p.j[c] >= 0.5)) return false;
  }
  for (const [s, min] of Object.entries(state.scores)) if (min > 0 && !(p.j && p.j[s] >= min)) return false;
  if (state.q) {
    const l = p.landing || {};
    const hay = [p.url, p.title, l.hero && l.hero.heading, l.hero && l.hero.text, ...(p.ads || []).map(a => a.page_name)].join(" ").toLowerCase();
    if (!hay.includes(state.q.toLowerCase())) return false;
  }
  return true;
}
const SORTS = {ads: p => p.ad_ids.length, days: p => p.max_days, chars: p => p.chars || 0,
  ...Object.fromEntries(["ad_match", "trust", "cta_clarity", "promise_specificity"].map(s => [s, p => p.j ? p.j[s] : -1]))};

function update() {
  history.replaceState(null, "", "#" + encodeURIComponent(JSON.stringify(state)));
  render();
}

function buildFilters() {
  const root = document.getElementById("filters");
  root.replaceChildren();
  root.append(el("label", {class: "field"}, "Caută în pagină sau după advertiser",
    el("input", {type: "search", value: state.q, oninput: e => { state.q = e.target.value; update(); }})));
  for (const dim of CHIP_DIMS) {
    const counts = {};
    for (const p of PAGES) { const v = valueOf(p, dim); if (v) counts[v] = (counts[v] || 0) + 1; }
    const values = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
    if (!values.length) continue;
    root.append(el("div", {class: "group"}, el("h3", {text: DIM[dim] || dim}), el("div", {class: "chips"}, values.map(v =>
      el("button", {class: "chip", type: "button", "aria-pressed": (state.sets[dim] || []).includes(v),
        onclick: () => { const s = new Set(state.sets[dim] || []); s.has(v) ? s.delete(v) : s.add(v); state.sets[dim] = [...s]; buildFilters(); update(); }},
        label(v) + " ", el("small", {text: counts[v]}))))));
  }
  const checks = [...FACTS, ...(PAGES.some(p => p.j) ? NOULS : [])];
  root.append(el("div", {class: "group"}, el("h3", {text: "Pagina conține"}), checks.map(c =>
    el("label", {class: "check"}, el("input", {type: "checkbox", checked: state.checks.includes(c) ? "" : null,
      onchange: e => { state.checks = e.target.checked ? [...state.checks, c] : state.checks.filter(x => x !== c); update(); }}), DIM[c] || c))));
  if (PAGES.some(p => p.j)) root.append(el("div", {class: "group"}, el("h3", {text: "Scor minim"}), SCORES.map(s => {
    const out = el("b", {text: Math.round((state.scores[s] || 0) * 100) + "%"});
    return el("label", {class: "field"}, (DIM[s] || s) + " ", out, el("input", {type: "range", min: 0, max: 1, step: 0.5, value: state.scores[s] || 0,
      oninput: e => { state.scores[s] = +e.target.value; out.textContent = Math.round(state.scores[s] * 100) + "%"; update(); }}));
  })));
  root.append(el("button", {class: "reset", type: "button", onclick: () => { state = fresh(); state.sets = {}; document.getElementById("sort").value = "ads"; buildFilters(); update(); }}, "Șterge toate filtrele"));
}

function buildFindings() {
  const box = document.getElementById("findings");
  const dest = Object.entries(SUMMARY.destinations || {}).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${label(k)} ${n}`).join(", ");
  if (!META.n_judged) {
    box.append(el("h2", {text: "Paginile nu au fost încă judecate de Jev"}),
      el("p", {class: "note", text: `Destinații: ${dest}. Pune TYPESAFE_API_KEY în .env și rulează /wizard-landing-review reanalyze pe acest dosar.`}));
    return;
  }
  box.append(el("h2", {text: `Cum arată cele ${SUMMARY.n_pages} pagini de landing ale reclamelor potrivite`}));
  const rows = Object.entries(SUMMARY.dims).filter(([d, list]) => list.length && list[0].pct > 0);
  box.append(el("ul", {}, rows.map(([d, list]) => el("li", {text: list[0].value === "yes"
    ? `${DIM[d] || d}: ${list[0].pct}% dintre pagini`
    : `${DIM[d] || d}: cel mai des ${label(list[0].value).toLowerCase()}, la ${list[0].pct}%`}))));
  box.append(el("p", {class: "note", text: `Destinațiile tuturor reclamelor potrivite: ${dest}. Sunt tipare descriptive, nu dovezi că pagina convertește.` +
    (SUMMARY.n_pages < 10 ? " Eșantionul e mic." : "")}));
}

function card(p) {
  const l = p.landing, tags = [];
  if (p.j) {
    for (const c of CHOICES) tags.push(el("span", {class: "tag" + ((p.unsure || []).includes(c) ? " unsure" : ""),
      title: (DIM[c] || c) + ((p.unsure || []).includes(c) ? " (Jev nu e sigur)" : ""), text: label(p.j[c])}));
    for (const n of NOULS) if (p.j[n] >= 0.5) tags.push(el("span", {class: "tag yes", text: DIM[n] || n}));
    for (const s of SCORES) tags.push(el("span", {class: "tag", text: `${DIM[s] || s}: ${Math.round(p.j[s] * 100)}%`}));
  }
  if (p.facts) {
    for (const f of FACTS) if (p.facts[f]) tags.push(el("span", {class: "tag yes", text: DIM[f] + (f === "has_form" ? ` (${p.facts.form_fields} câmpuri)` : "")}));
  }
  const status = p.error ? "Nu s-a putut deschide: " + p.error : p.thin ? "Aproape fără text vizibil (pagină JS sau blocată)" : null;
  return el("article", {class: "card" + (p.type !== "web" || p.error ? " off" : "")},
    el("div", {class: "stamp"},
      el("div", {class: "dest"}, el("b", {text: p.ad_ids.length}), el("span", {text: p.ad_ids.length === 1 ? "reclamă" : "reclame"})),
      el("div", {class: "meta"}, el("strong", {text: host(p.final_url || p.url)}), el("div", {text: label(p.type)}),
        p.max_days ? el("div", {text: `cea mai veche reclamă: ${p.max_days} zile`}) : null)),
    el("div", {class: "copy"},
      l ? el("p", {class: "hook", text: l.hero.heading || l.title || "(fără titlu)"}) : el("p", {class: "hook", text: p.title || p.url}),
      l && l.hero.text ? el("p", {class: "body clamp", text: l.hero.text}) : null,
      p.price ? el("div", {class: "price", text: p.price}) : null,
      l && l.hero.buttons.length ? el("div", {class: "headline"}, el("span", {text: "Butoane în primul ecran: " + l.hero.buttons.slice(0, 5).join(" · ")})) : null,
      status ? el("p", {class: "note", text: status}) : null),
    tags.length ? el("div", {class: "tags"}, tags) : null,
    l && l.sections.length ? el("details", {class: "sections"}, el("summary", {text: `Toată pagina (${l.sections.length} secțiuni)`}),
      l.sections.map(s => [s.heading ? el("h4", {text: s.heading}) : null, s.text ? el("p", {text: s.text}) : null,
        s.buttons.length ? el("p", {text: "Butoane: " + s.buttons.join(" · ")}) : null])) : null,
    (p.ads || []).length ? el("details", {class: "adlinks"}, el("summary", {text: "Reclamele care duc aici"}),
      p.ads.slice(0, 10).map(a => el("a", {href: safeHref(a.library_url), target: "_blank", rel: "noopener noreferrer",
        text: `${a.page_name}, ${a.days} zile: ${a.hook || ""}`}))) : null,
    safeHref(p.url) ? el("a", {class: "open", href: safeHref(p.url), target: "_blank", rel: "noopener noreferrer", text: "Deschide pagina"}) : null);
}

function render() {
  const key = SORTS[state.sort] || SORTS.ads;
  const shown = PAGES.filter(passes).sort((a, b) => key(b) - key(a));
  document.getElementById("count").textContent = `${shown.length} din ${PAGES.length} destinații`;
  document.getElementById("grid").replaceChildren(...(shown.length ? shown.map(card) : [el("div", {class: "empty"},
    el("h2", {text: "Nicio pagină nu trece de filtrele alese"}),
    el("p", {text: "Scoate câteva filtre din stânga sau apasă „Șterge toate filtrele”."}))]));
}

document.getElementById("title").textContent = META.niche ? "Landing-uri: " + META.niche : "Pagini de landing";
document.title = document.getElementById("title").textContent;
document.getElementById("lede").textContent = PAGES.length
  ? `${META.n_ads} reclame potrivite din ${META.country} duc spre ${META.n_destinations} destinații, dintre care ${META.n_web} pagini web; ` +
    `${META.n_saved} au fost citite pe ${(META.fetched_at || "").slice(0, 10)}. Fiecare pagină e vizitată o singură dată, oricâte reclame duc la ea.`
  : "Lipsește landings-data.js lângă acest fișier. Rulează /wizard-landing-review ca să generezi pagina.";
if (window.matchMedia("(max-width: 860px)").matches) document.getElementById("rail").open = false;
const sortBox = document.getElementById("sort");
sortBox.value = state.sort;
sortBox.addEventListener("change", e => { state.sort = e.target.value; update(); });
buildFilters(); buildFindings(); render();
</script>
</body>
</html>
